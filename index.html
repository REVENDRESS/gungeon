<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHIBI SHOOTER — TEST ROOM</title><style>html,body{margin:0;background:#10121e;color:#f6e9f3;font-family:system-ui,sans-serif;height:100%;overflow:hidden}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}.hint{position:fixed;left:16px;top:14px;background:#141727d9;border:1px solid #8a668c;border-radius:10px;padding:12px;font-size:13px;line-height:1.8;pointer-events:none}.hint b{color:#ffa8cf}.touch{position:fixed;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none}.pad{width:125px;height:125px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff12;position:relative;pointer-events:auto;touch-action:none}.knob{width:43px;height:43px;border-radius:50%;background:#ffa4d4aa;border:2px solid #fff9;position:absolute;left:39px;top:39px}.right .knob{background:#7fd8ffaa}</style></head><body><canvas id="c"></canvas><div class="hint"><b>TEST ROOM / 移動・照準テスト</b><br>左スティック：移動　右スティック：360°照準<br>PC：WASD 移動 / マウス照準<br>R2 / 左クリック：試射　（スマホ：左右の仮想スティック）<br><span id="status">ゲームパッド接続待ち</span></div><div class="touch"><div class="pad" id="move"><div class="knob"></div></div><div class="pad right" id="aim"><div class="knob"></div></div></div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W=0,H=0,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
let p={x:0,y:0,face:1,bob:0,angle:0},keys={},bullets=[],particles=[],shootCooldown=0,last=performance.now(),mouseAim=false;addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){mouseAim=true;p.angle=Math.atan2(e.clientY-(H/2+p.y),e.clientX-(W/2+p.x))}});canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){keys.Mouse=true;mouseAim=true}});addEventListener('pointerup',()=>keys.Mouse=false);
const sticks={move:{x:0,y:0},aim:{x:0,y:0}};for(const name of ['move','aim']){const el=document.getElementById(name),knob=el.firstElementChild;let id=null;function set(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy),max=42,scale=Math.min(1,max/(mag||1));sticks[name]={x:dx*scale/max,y:dy*scale/max};knob.style.transform=`translate(${dx*scale}px,${dy*scale}px)`}el.addEventListener('pointerdown',e=>{id=e.pointerId;el.setPointerCapture(id);set(e)});el.addEventListener('pointermove',e=>{if(id===e.pointerId)set(e)});function end(e){if(id!==e.pointerId)return;id=null;sticks[name]={x:0,y:0};knob.style.transform=''}el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function shoot(){let a=p.angle,x=p.x+Math.cos(a)*31,y=p.y+Math.sin(a)*31;bullets.push({x,y,vx:Math.cos(a)*560,vy:Math.sin(a)*560,t:0});for(let i=0;i<5;i++){let aa=a+(Math.random()-.5)*1.2;particles.push({x,y,vx:Math.cos(aa)*80,vy:Math.sin(aa)*80,t:0})}}
function frame(now){let dt=Math.min((now-last)/1000,.04);last=now;let gp=navigator.getGamepads?.().find(g=>g&&g.connected);document.getElementById('status').textContent=gp?`🎮 ${gp.id.slice(0,35)}`:'🎮 コントローラー接続待ち';let mx=sticks.move.x,my=sticks.move.y;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;if(gp){let dead=v=>Math.abs(v)>.18?v:0;mx+=dead(gp.axes[0]||0);my+=dead(gp.axes[1]||0);let ax=dead(gp.axes[2]||0),ay=dead(gp.axes[3]||0);if(Math.hypot(ax,ay)>.2){p.angle=Math.atan2(ay,ax);mouseAim=false}}if(Math.hypot(sticks.aim.x,sticks.aim.y)>.2){p.angle=Math.atan2(sticks.aim.y,sticks.aim.x);mouseAim=false}let m=Math.hypot(mx,my);if(m>.01){mx/=Math.max(1,m);my/=Math.max(1,m);p.x+=mx*190*dt;p.y+=my*190*dt;p.bob+=dt*13;if(Math.abs(mx)>.12)p.face=mx>0?1:-1}else p.bob=0;p.x=Math.max(-W/2+45,Math.min(W/2-45,p.x));p.y=Math.max(-H/2+55,Math.min(H/2-45,p.y));shootCooldown-=dt;if((keys.Mouse||keys.Space||(gp&&(gp.buttons[7]?.pressed||gp.buttons[0]?.pressed)))&&shootCooldown<=0){shoot();shootCooldown=.13}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t+=dt}bullets=bullets.filter(b=>b.t<1.2);for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.t+=dt}particles=particles.filter(q=>q.t<.2);
ctx.clearRect(0,0,W,H);ctx.fillStyle='#171a29';ctx.fillRect(0,0,W,H);let ox=W/2,oy=H/2;ctx.save();ctx.translate(ox,oy);const tile=56;for(let x=Math.floor(-W/2/tile)*tile;x<W/2;x+=tile)for(let y=Math.floor(-H/2/tile)*tile;y<H/2;y+=tile){rect(x+2,y+2,tile-4,tile-4,((Math.floor(x/tile)+Math.floor(y/tile))%2)?'#25283a':'#222638');rect(x+8,y+8,4,4,'#2c3044')}ctx.strokeStyle='#755c7a';ctx.lineWidth=8;ctx.strokeRect(-W/2+15,-H/2+15,W-30,H-30);
for(let i=0;i<8;i++){let x=Math.sin(i*3.1)*Math.min(W*.38,360),y=Math.cos(i*4.2)*Math.min(H*.35,240);circle(x,y,15,'#303247');circle(x,y-5,11,'#57506a');rect(x-3,y-9,6,6,'#ff6f86')}
for(const b of bullets){circle(b.x,b.y,6,'#ffaf50');circle(b.x,b.y,3,'#fff4ae')}for(const q of particles)circle(q.x,q.y,3*(1-q.t/.2),'#ffc76d');let bounce=m>.01?Math.abs(Math.sin(p.bob))*7:0;circle(p.x,p.y+21,20,'#090c17aa');ctx.save();ctx.translate(p.x,p.y-bounce);ctx.scale(p.face,1);
// Tiny one-head-tall chibi girl sprite, drawn with clean pixel geometry
rect(-14,10,11,14,'#29243f');rect(4,10,11,14,'#29243f');rect(-16,20,13,5,'#f4a2c6');rect(3,20,13,5,'#f4a2c6');rect(-17,3,34,15,'#b76caa');rect(-12,5,24,11,'#f5a9d3');rect(-22,-19,44,33,'#f6b7d8');rect(-19,-25,38,10,'#f7c3df');rect(-23,-23,10,19,'#f1a0c9');rect(13,-23,10,19,'#f1a0c9');rect(-13,-30,10,11,'#ec8ebd');rect(4,-30,10,11,'#ec8ebd');rect(-17,-10,34,22,'#ffe3d3');rect(-11,-5,5,8,'#382e48');rect(7,-5,5,8,'#382e48');rect(-13,5,6,4,'#f49fa9');rect(9,5,6,4,'#f49fa9');rect(-2,5,4,2,'#b16b80');rect(-24,-16,9,19,'#ec9dc9');rect(15,-16,9,19,'#ec9dc9');ctx.restore();
// gun always follows 360 degree right-stick aim, independent of sprite facing
ctx.save();ctx.translate(p.x,p.y-bounce+5);ctx.rotate(p.angle);ctx.fillStyle='#111526';ctx.fillRect(5,-7,34,15);rect(9,-5,24,10,'#a8b3d4');rect(18,-8,12,5,'#ec8dba');rect(32,-4,18,8,'#5c6c92');rect(46,-6,7,12,'#e7a0c7');rect(11,6,7,14,'#6d5779');ctx.restore();ctx.strokeStyle='#ffadd6';ctx.lineWidth=1;let rx=p.x+Math.cos(p.angle)*115,ry=p.y+Math.sin(p.angle)*115;ctx.beginPath();ctx.arc(rx,ry,9,0,Math.PI*2);ctx.moveTo(rx-16,ry);ctx.lineTo(rx-5,ry);ctx.moveTo(rx+5,ry);ctx.lineTo(rx+16,ry);ctx.moveTo(rx,ry-16);ctx.lineTo(rx,ry-5);ctx.moveTo(rx,ry+5);ctx.lineTo(rx,ry+16);ctx.stroke();ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
